# zapret2 profile argument templates
# /usr/local/etc/zapret2/profiles.conf
#
# ============================================================
# IMPORTANT: These are EXAMPLE values for dvtws2 Lua-based desync strategies.
# The actual profile arguments used by the service are defined in zapret2.inc,
# not read from this file. This file is documentation only.
#
# For available --lua-desync parameters see:
# https://github.com/bol-van/zapret2/blob/main/docs/manual.md
# ============================================================

# SAFE: TCP stream splitting only — minimal risk.
SAFE=--lua-desync=multisplit

# DEFAULT: Balanced recommended mode.
# Multisplit + fake TLS packet with TCP MD5 signature.
DEFAULT=--lua-desync=multisplit --lua-desync=fake:blob=fake_default_tls:tcp_md5

# MULTIDISORDER: multidisorder with sequence number overlap.
# Effective on Rostelecom, Beeline, MTS and similar Russian ISPs.
MULTIDISORDER=--lua-desync=multidisorder:pos=1,midsld:seqovl=1

# FAKE_DISORDER: fake TLS with repeats + multidisorder.
# Effective on some regional ISPs.
FAKE_DISORDER=--lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=11 --lua-desync=multidisorder:pos=1,midsld

# WSSIZE: TCP window size reduction + multisplit.
# Use when fragment-based methods do not work.
WSSIZE=--lua-desync=wssize:wsize=1:scale=6 --lua-desync=multisplit:pos=midsld

# FAKE_AGGRESSIVE: Aggressive fake TLS with high repeat count + multidisorder.
# For stubborn DPI that resists lower repeat counts or simple disorder methods.
FAKE_AGGRESSIVE=--lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=15 --lua-desync=multidisorder:pos=1,midsld

# SYNDATA: SYN packet with data + multisplit targeting host header position.
# Alternative method when fragment-based desync is actively blocked by DPI.
SYNDATA=--lua-desync=syndata --lua-desync=multisplit:pos=host

# WSSIZE_DISORDER: Window size reduction combined with multidisorder + seqovl.
# Combo method effective when either technique alone is insufficient.
WSSIZE_DISORDER=--lua-desync=wssize:wsize=1:scale=6 --lua-desync=multidisorder:pos=1,midsld:seqovl=1

# TLS_CLONE: Clones TLS Client Hello to confuse stateful DPI inspection.
# Mirrors the TLS handshake structure — similar to FAKE TLS AUTO in zapret-discord-youtube.
TLS_CLONE=--lua-desync=tls_client_hello_clone --lua-desync=multisplit:pos=midsld

# HOSTFAKESPLIT: fake TLS with TCP MD5 fooling + hostfakesplit.
# ALT9 style from zapret-discord-youtube. Works where seqovl-based methods fail.
HOSTFAKESPLIT=--lua-desync=fake:blob=fake_default_tls:tcp_md5 --lua-desync=hostfakesplit

# FAKE_MULTISPLIT_SEQOVL: fake TLS ×8 + multisplit with seqovl=681.
# ALT11/ALT12 style. Effective on ISPs that pass multisplit but require a seqovl pattern.
FAKE_MULTISPLIT_SEQOVL=--lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=8 --lua-desync=multisplit:pos=1:seqovl=681

# FAKE_TS: fake TLS with timestamp (ts) fooling instead of md5sig.
# Lighter alternative when md5sig-based fakes are detected or rejected.
FAKE_TS=--lua-desync=fake:blob=fake_default_tls:ts:repeats=6 --lua-desync=multisplit:pos=1

# FAKE_DISORDER_SNI: fake TLS with rnd+dupsid+sni=www.google.com + multidisorder.
# FAKE TLS AUTO / ALT3 style from zapret-discord-youtube. Strong against stateful DPI.
FAKE_DISORDER_SNI=--lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=11:tls_mod=rnd,dupsid,sni=www.google.com --lua-desync=multidisorder:pos=1,midsld

# CUSTOM: Arguments are taken from the GUI "Custom dvtws2 Arguments" field.
# This entry is informational only — actual args come from config.xml.
CUSTOM=<see GUI: Services → Zapret2 → Custom dvtws2 Arguments>

# ============================================================
# ALIAS INCLUDE MODE
# When alias_name is set in GUI (and discord_enabled=off), IPFW rule 100 uses
# 'table(1)' as destination — only traffic to alias IPs is sent to dvtws2.
# Alias hostname entries are skipped (ipfw tables require IPs/CIDRs).
# If alias resolves to zero IPs, falls back to 'any'.

# DISCORD BYPASS
# When discord_enabled=on, dvtws2 receives:
#   --hostlist=/usr/local/etc/zapret2/discord-hostlist.txt
# File is regenerated from hardcoded domain list in zapret2.inc on each service start.
# IPFW rule 100 uses 'any' (hostlist inside dvtws2 filters by domain name).
# When discord_udp_enabled=on, IPFW adds:
#   rule 101: divert UDP 443 (QUIC)
#   rule 102: divert UDP 50000-65535 (voice/video)

# YOUTUBE BYPASS
# When youtube_enabled=on, dvtws2 receives:
#   --hostlist=/usr/local/etc/zapret2/youtube-hostlist.txt
# File is regenerated from hardcoded domain list in zapret2.inc on each service start.
# Domains: youtube.com, googlevideo.com, ytimg.com, youtu.be, yt3.ggpht.com, etc.
# IPFW rule 100 uses 'any' (hostlist inside dvtws2 filters by domain name).
# When youtube_quic_enabled=on, IPFW adds:
#   rule 101: divert UDP 443 (QUIC / HTTP3)
# Compatible with Discord bypass — both hostlists are passed to dvtws2 simultaneously.
# ============================================================
