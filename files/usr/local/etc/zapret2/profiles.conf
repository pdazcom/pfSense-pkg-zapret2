# zapret2 profile argument templates
# /usr/local/etc/zapret2/profiles.conf
#
# ============================================================
# IMPORTANT: These are EXAMPLE values for dvtws2 Lua-based desync strategies.
# The actual profile arguments used by the service are defined in zapret2.inc,
# not read from this file. This file is documentation only.
#
# For available --lua-desync parameters see:
# https://github.com/bol-van/zapret2/blob/main/docs/manual.md
# ============================================================

# SAFE: TCP stream splitting only — minimal risk.
SAFE=--lua-desync=multisplit

# DEFAULT: Balanced recommended mode.
# Multisplit + fake TLS packet with TCP MD5 signature.
DEFAULT=--lua-desync=multisplit --lua-desync=fake:blob=fake_default_tls:tcp_md5

# MULTIDISORDER: multidisorder with sequence number overlap.
# Effective on Rostelecom, Beeline, MTS and similar Russian ISPs.
MULTIDISORDER=--lua-desync=multidisorder:pos=1,midsld:seqovl=1

# FAKE_DISORDER: fake TLS with repeats + multidisorder.
# Effective on some regional ISPs.
FAKE_DISORDER=--lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=11 --lua-desync=multidisorder:pos=1,midsld

# WSSIZE: TCP window size reduction + multisplit.
# Use when fragment-based methods do not work.
WSSIZE=--lua-desync=wssize:wsize=1:scale=6 --lua-desync=multisplit:pos=midsld

# CUSTOM: Arguments are taken from the GUI "Custom dvtws2 Arguments" field.
# This entry is informational only — actual args come from config.xml.
CUSTOM=<see GUI: Services → Zapret2 → Custom dvtws2 Arguments>
